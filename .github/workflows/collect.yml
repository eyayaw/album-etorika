name: collect

on:
  schedule:
    # GitHub delays scheduled runs under high load, which includes the start of every hour, and
    # may drop them (checked 2026-11-13):
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    - cron: '17 11,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 collect.py

      # scripts/push-exports.sh pushes to the same branch, so the push rebases first.
      - name: commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add data
          git commit -m "collect $(date -u +%F)"
          git pull --rebase -q
          git push
